services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-adaptive_mlops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-adaptive_mlops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-adaptive_mlops}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DATABASE_SSL_MODE=${DATABASE_SSL_MODE:-}
      - SQLALCHEMY_DATABASE_URI=${SQLALCHEMY_DATABASE_URI:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - INSFORGE_PROJECT_URL=${INSFORGE_PROJECT_URL:-https://bdrb7j6b.ap-southeast.insforge.app}
      - INSFORGE_API_KEY=${INSFORGE_API_KEY:-}
      - INSFORGE_ANON_KEY=${INSFORGE_ANON_KEY:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-secret-admin-key}
      - SECRET_KEY=${SECRET_KEY:-super-secret-local-key-xyz123}
      - ENABLE_DEMO_MODE=${ENABLE_DEMO_MODE:-true}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./ml:/ml

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:5173"
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  postgres_data:
